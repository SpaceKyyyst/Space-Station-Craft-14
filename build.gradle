plugins {
    id 'eclipse'
    id 'checkstyle'
    id 'pmd'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = '0.1.27'
base.archivesName = "ssc_14"

repositories {
    mavenCentral()
    maven { url = 'https://api.modrinth.com/maven' }
}

dependencies {
    implementation "maven.modrinth:ItemPhysic:1.8.15"
    implementation "maven.modrinth:creativecore:2.14.16-neoforge"
    implementation "maven.modrinth:fusion-connected-textures:1.3.15-neoforge-mc26.1"
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// Keep server fixtures and test subscribers out of the published mod jar.
sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    gameTestImplementation.extendsFrom implementation
    gameTestRuntimeOnly.extendsFrom runtimeOnly
}

def gameTestReport = layout.buildDirectory.file('test-results/gameTest/TEST-atmosphere.xml')

neoForge {
    version = "26.1.2.71"
    addModdingDependenciesTo sourceSets.gameTest

    mods {
        mcreator {
            sourceSet sourceSets.main
        }
        mcreatorGameTest {
            sourceSet sourceSets.main
            sourceSet sourceSets.gameTest
        }
    }

    unitTest {
        enable()
        testedMod = mods.mcreator
        loadedMods = [mods.mcreator]
    }

    runs {
        configureEach {
            loadedMods = [mods.mcreator]
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }

        client {
            client()

            def mcreatorJvmOptions = System.getenv('MCREATOR_JVM_OPTIONS')
            if (mcreatorJvmOptions) {
                mcreatorJvmOptions.split("\\s+").findAll { it.trim() }.each { arg ->
                    jvmArgument(arg)
                }
            }
        }
        server {
            server()
        }
        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.gameTest
            loadedMods = [mods.mcreatorGameTest]
            gameDirectory = layout.buildDirectory.dir('gameTest/run').get().asFile
            programArguments = [
                '--tests', 'ssc_14:*',
                '--report', gameTestReport.get().asFile.absolutePath
            ]
        }
    }
}

tasks.named('runGameTestServer') {
    doFirst {
        def report = gameTestReport.get().asFile
        report.parentFile.mkdirs()
        // A failed startup must never leave a previous successful report behind.
        java.nio.file.Files.deleteIfExists(report.toPath())
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

apply from: 'Dependency.gradle'

// Compile domain rules without Minecraft or its runtime bootstrap.
sourceSets {
    domain {
        java {
            srcDir 'src/main/java'
            include 'net/mcreator/ssc/GasType.java'
            include 'net/mcreator/ssc/GasReaction.java'
            include 'net/mcreator/ssc/combat/**'
            include 'net/mcreator/ssc/atmosphere/**'
            include 'net/mcreator/ssc/energy/ConnectedComponents.java'
            include 'net/mcreator/ssc/energy/EnergyAllocation.java'
            include 'net/mcreator/ssc/energy/EnergyTickBudget.java'
            include 'net/mcreator/ssc/math/**'
            include 'net/mcreator/ssc/scheduling/TickTaskQueue.java'
            include 'net/mcreator/ssc/diagnostics/TickPhase.java'
            include 'net/mcreator/ssc/network/validation/**'
            include 'net/mcreator/ssc/chemistry/**'
        }
    }
    domainTest {
        compileClasspath += sourceSets.domain.output
        runtimeClasspath += sourceSets.domain.output
    }
}

dependencies {
    domainTestImplementation platform('org.junit:junit-bom:6.1.3')
    domainTestImplementation 'org.junit.jupiter:junit-jupiter'
    domainTestRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.register('domainTest', Test) {
    description = 'Tests domain rules without starting Minecraft.'
    group = 'verification'
    testClassesDirs = sourceSets.domainTest.output.classesDirs
    classpath = sourceSets.domainTest.runtimeClasspath
    useJUnitPlatform()
}

tasks.named('check') {
    dependsOn tasks.named('domainTest')
}

checkstyle {
    toolVersion = '14.3.0'
    configFile = file('config/checkstyle/checkstyle.xml')
}

pmd {
    toolVersion = '7.28.0'
    ruleSets = []
    ruleSetFiles = files('config/pmd/correctness.xml')
    consoleOutput = true
}

// Analyze every production source, including generated adapters, once.
tasks.withType(Pmd).configureEach {
    enabled = name in ['pmdMain', 'methodMetrics']
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.register('methodMetrics', Pmd) {
    description = 'Reports cyclomatic complexity of every method; this is not a manual review.'
    group = 'verification'
    source = sourceSets.main.allJava
    classpath = files()
    ruleSets = []
    ruleSetFiles = files('config/pmd/metrics.xml')
    ignoreFailures = true
    consoleOutput = false
    reports {
        xml.outputLocation = layout.buildDirectory.file('reports/pmd/method-metrics.xml')
        html.outputLocation = layout.buildDirectory.file('reports/pmd/method-metrics.html')
    }
}

tasks.named('check') {
    dependsOn tasks.named('methodMetrics')
}

// Start with the extracted domain, rather than a blanket generated-code suppression.
tasks.withType(Checkstyle).configureEach {
    enabled = name == 'checkstyleMain'
    source = sourceSets.domain.allJava
    classpath = files()
    reports {
        xml.required = true
        html.required = true
    }
}
