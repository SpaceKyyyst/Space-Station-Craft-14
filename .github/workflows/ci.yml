name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ssc14-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-tests:
    name: PR tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate project metadata
        run: python .github/scripts/check_project.py
      - name: Dry-run release planner
        run: python .github/scripts/release_dry_run.py
      - name: Validate architecture and resources
        run: |
          python .github/scripts/check_architecture.py
          python .github/scripts/check_procedure_graph.py
          python .github/scripts/check_resources.py
          python .github/scripts/check_menu_security.py
      - name: Validate pull request policy
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: python .github/scripts/policy_checks.py --event "$GITHUB_EVENT_PATH" --repository "$GITHUB_WORKSPACE"
      - name: Run governance checks
        run: python -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Run Gradle quality checks and tests
        run: ./gradlew test domainTest compileGameTestJava checkstyleMain pmdMain --no-daemon

  release:
    name: Build and release version change
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Detect version change
        id: version
        shell: bash
        run: |
          current=$(sed -nE "s/^version[[:space:]]*=[[:space:]]*['\"]([^'\"]+)['\"]$/\1/p" build.gradle | head -n1)
          previous=$(git show HEAD^:build.gradle 2>/dev/null | sed -nE "s/^version[[:space:]]*=[[:space:]]*['\"]([^'\"]+)['\"]$/\1/p" | head -n1 || true)
          test -n "$current"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "changed=$([[ "$current" != "$previous" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Stop when version is unchanged
        if: steps.version.outputs.changed != 'true'
        run: echo "Version unchanged (${{ steps.version.outputs.current }}); release skipped."
      - name: Check duplicate release
        if: steps.version.outputs.changed == 'true'
        id: duplicate
        shell: bash
        run: |
          version='${{ steps.version.outputs.current }}'
          if git tag --list "ssc_14-${version}-build.*" | grep -q .; then
            echo "duplicate=true" >> "$GITHUB_OUTPUT"
            echo "Release already exists for $version; skipping."
          else
            echo "duplicate=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build artifact
        if: steps.version.outputs.changed == 'true' && steps.duplicate.outputs.duplicate != 'true'
        run: ./gradlew build --no-daemon
      - name: Publish GitHub release
        if: steps.version.outputs.changed == 'true' && steps.duplicate.outputs.duplicate != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version='${{ steps.version.outputs.current }}'
          tag="ssc_14-${version}-build.${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:12}"
          jar=$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' | head -n1)
          test -n "$jar"
          # Build release notes from the latest published SSC14 release tag to HEAD.
          previous_tag=$(git tag --list 'ssc_14-*' --sort=-version:refname | head -n1 || true)
          if [ -n "$previous_tag" ]; then
            range="${previous_tag}..${GITHUB_SHA}"
          else
            range="HEAD^..${GITHUB_SHA}"
          fi
          git log --pretty='- %s' "$range" > release-notes.txt
          test -s release-notes.txt || printf '%s\n' "- Version ${version}" > release-notes.txt
          git tag "$tag" "$GITHUB_SHA"
          git push origin "$tag"
          notes=$(head -n 100 release-notes.txt)
          gh release create "$tag" "$jar" --title "SSC14 $version" --notes "## Changes\n${notes}"
      - name: Notify Discord
        if: steps.version.outputs.changed == 'true' && steps.duplicate.outputs.duplicate != 'true'
        env:
          DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          VERSION: ${{ steps.version.outputs.current }}
          RUN_NUMBER: ${{ github.run_number }}
          SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          if [ -z "$DISCORD_RELEASE_WEBHOOK" ]; then
            echo "DISCORD_RELEASE_WEBHOOK is not configured; notification skipped."
            exit 0
          fi
          jar=$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' | head -n1)
          url="https://github.com/${REPOSITORY}/releases/tag/ssc_14-${VERSION}-build.${RUN_NUMBER}-${SHA:0:12}"
          notes=$(head -n 100 release-notes.txt 2>/dev/null || printf '%s\n' "- Version ${VERSION}")
          discord_notes=$(python - <<'PY'
          from pathlib import Path

          lines = Path("release-notes.txt").read_text(encoding="utf-8").splitlines()
          max_lines = 12
          max_chars = 1800
          selected = []
          used_chars = 0
          for line in lines:
              if len(selected) >= max_lines or used_chars + len(line) + 1 > max_chars:
                  break
              selected.append(line)
              used_chars += len(line) + 1
          remaining = len(lines) - len(selected)
          if remaining:
              selected.append(f"- … ещё {remaining} изменений")
          print("\\n".join(selected))
          PY
          )
          payload=$(python - "$VERSION" "$RUN_NUMBER" "$url" "$discord_notes" <<'PY'
          import json, sys
          version, build, url, notes = sys.argv[1:]
          normalized = version.lower()
          status = "🟡 ALPHA" if "alpha" in normalized else "🔵 BETA" if "beta" in normalized else "🟣 RC" if "rc" in normalized else "🟠 FIX" if any(marker in normalized for marker in ("fix", "patch", "hotfix")) else "🟢 RELEASE"
          print(json.dumps({"flags": 32768, "username": "SSC14 • Система оповещения", "allowed_mentions": {"parse": []}, "components": [{"type": 10, "content": "||@Ждун обновлений||"}, {"type": 17, "components": [{"type": 10, "content": f"# 🚀 SSC14 | Release {version}\\n**Сборка:** `{build}` • **Статус:** {status}"}, {"type": 14, "spacing": 2, "divider": True}, {"type": 9, "components": [{"type": 10, "content": f"### 📋 Изменения\\n\\n{notes}"}], "accessory": {"type": 2, "style": 5, "label": "GitHub", "url": url, "emoji": {"name": "⭐"}}}, {"type": 14, "spacing": 1, "divider": True}, {"type": 10, "content": "-# Space Station Craft 14 • GitHub Release Notifications"}]}]}))
          PY
          )
          separator='?'
          if [[ "$DISCORD_RELEASE_WEBHOOK" == *\?* ]]; then
            separator='&'
          fi
          webhook_url="${DISCORD_RELEASE_WEBHOOK}${separator}wait=true&with_components=true"
          # Components v2 messages cannot include files; the JAR is linked by the release button.
          curl --fail-with-body -X POST "$webhook_url" -F "payload_json=$payload"
